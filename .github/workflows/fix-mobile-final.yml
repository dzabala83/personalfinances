name: Fix mobile transactions

on:
  push:
    branches: [main]
    paths-ignore:
      - 'index.html'

permissions:
  contents: write

jobs:
  fix-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix mobile script
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* Mobile transaction cards: keeps the existing desktop table and filter logic intact. */'
          start=s.find(marker)
          if start < 0:
              raise SystemExit('mobile script marker not found')
          script_start=s.rfind('<script>',0,start)
          script_end=s.find('</script>',start)
          if script_start < 0 or script_end < 0:
              raise SystemExit('mobile script bounds not found')
          fixed=r'''<script>
          /* Mobile transaction cards: stable version. */
          (function(){
            function buildMobileList(card){
              if(!card || window.innerWidth>600) return;
              const tableWrap=card.querySelector('.table-wrap');
              const table=tableWrap && tableWrap.querySelector('table');
              if(!table) return;
              let mobile=card.querySelector('.tx-mobile-list');
              if(mobile) mobile.remove();
              mobile=document.createElement('div');
              mobile.className='tx-mobile-list';
              const rows=table.querySelectorAll('tbody tr');
              rows.forEach(row=>{
                const cells=row.children;
                if(cells.length<6) return;
                const desc=cells[1].textContent.trim();
                const date=cells[0].textContent.trim();
                const cat=cells[2].textContent.trim() || 'Sin categoría';
                const tipo=cells[3].textContent.trim();
                const monto=cells[4].textContent.trim();
                const actions=cells[5].innerHTML;
                const gasto=tipo==='Gasto';
                const item=document.createElement('div');
                item.className='tx-mobile-card';
                item.innerHTML='<div class="tx-mobile-top"><div style="min-width:0;"><div class="tx-mobile-desc"></div><div class="tx-mobile-date"></div></div><div class="tx-mobile-amount '+(gasto?'gasto':'ingreso')+'">'+(gasto?'−':'+')+monto.replace(/^Bs\s*/,'')+'</div></div><div class="tx-mobile-meta"><div class="tx-mobile-cat"></div><span class="pill '+(gasto?'gasto':'ingreso')+'"></span><div class="tx-mobile-actions">'+actions+'</div></div>';
                item.querySelector('.tx-mobile-desc').textContent=desc;
                item.querySelector('.tx-mobile-date').textContent=date;
                item.querySelector('.tx-mobile-cat').textContent=cat;
                item.querySelector('.pill').textContent=tipo;
                mobile.appendChild(item);
              });
              tableWrap.parentNode.insertBefore(mobile,tableWrap.nextSibling);
            }
            function sync(){
              const card=document.getElementById('txListCard');
              if(card) buildMobileList(card);
            }
            function init(){
              const root=document.getElementById('app');
              if(!root) return;
              let timer=null;
              const observer=new MutationObserver(function(){
                clearTimeout(timer);
                timer=setTimeout(function(){
                  observer.disconnect();
                  sync();
                  observer.observe(root,{childList:true,subtree:true});
                },50);
              });
              observer.observe(root,{childList:true,subtree:true});
              window.addEventListener('resize',function(){observer.disconnect();sync();observer.observe(root,{childList:true,subtree:true});});
              setTimeout(sync,100);
            }
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();
          })();
          </script>'''
          s=s[:script_start]+fixed+s[script_end+len('</script>'):]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          grep -q 'Mobile transaction cards: stable version' index.html
          grep -q 'observer.disconnect()' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: estabilizar vista móvil de transacciones'
          git push
