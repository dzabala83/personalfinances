name: Corregir importes BNB

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reemplazar parser de importes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old = '''function parseAmount(v){
  if(v===''||v==null) return 0;
  if(typeof v === 'number') return v;
  let s = String(v).trim().replace(/[^\\d.,-]/g,'');
  if(s.includes(',') && s.includes('.')){
    s = s.replace(/\\./g,'').replace(',','.');
  } else if(s.includes(',') && !s.includes('.')){
    s = s.replace(',','.');
  }
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}'''

          new = '''function parseAmount(v){
  // Normaliza TODOS los importes de Excel antes de guardarlos.
  // Soporta 4,322.53 (miles=coma, decimal=punto), 4.322,53
  // (miles=punto, decimal=coma) y decimales simples.
  if(v==='' || v==null) return 0;
  if(typeof v === 'number') return Number.isFinite(v) ? v : 0;

  let s = String(v)
    .trim()
    .replace(/\\u00A0/g,' ')
    .replace(/[^\\d.,-]/g,'');
  if(!s) return 0;

  const comma = s.lastIndexOf(',');
  const dot = s.lastIndexOf('.');

  // Si existen ambos separadores, el último es el separador decimal.
  if(comma >= 0 && dot >= 0){
    if(comma > dot){
      // 4.322,53 -> 4322.53
      s = s.replace(/\\./g,'').replace(',', '.');
    }else{
      // 4,322.53 -> 4322.53
      s = s.replace(/,/g,'');
    }
  }
  // Solo coma: dos dígitos finales = decimal; tres dígitos = miles.
  else if(comma >= 0){
    const parts = s.split(',');
    const last = parts[parts.length-1];
    if(parts.length > 2 || last.length === 3){
      s = parts.join('');
    }else{
      s = s.replace(',', '.');
    }
  }
  // Solo punto: dos dígitos finales = decimal; tres dígitos = miles.
  else if(dot >= 0){
    const parts = s.split('.');
    const last = parts[parts.length-1];
    if(parts.length > 2 || last.length === 3){
      s = parts.join('');
    }
  }

  const n = Number(s);
  return Number.isFinite(n) ? n : 0;
}'''

          if old not in text:
              raise SystemExit('No se encontró el parser original esperado en index.html')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          print('Parser de importes reemplazado correctamente.')
          PY

      - name: Probar parser real
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile

          text = Path('index.html').read_text(encoding='utf-8')
          m = re.search(r"function parseAmount\\(v\\)\\{.*?\\n\\}", text, re.S)
          if not m:
              raise SystemExit('No se encontró parseAmount para probar')

          fn = m.group(0)
          cases = {
              '4,322.53': 4322.53,
              '1,500.00': 1500.0,
              '3,874.88': 3874.88,
              '521.33': 521.33,
              '24.50': 24.5,
              '4.322,53': 4322.53,
              '1.500,00': 1500.0,
              '24,50': 24.5,
              '1,500': 1500.0,
              '1.500': 1500.0,
          }

          lines = [fn]
          for raw, expected in cases.items():
              js = raw.replace('\\', '\\\\').replace("'", "\\'")
              lines.append(f"if(parseAmount('{js}') !== {expected}) throw new Error('{js} => ' + parseAmount('{js}'));" )
          script = '\n'.join(lines)
          with tempfile.NamedTemporaryFile('w', suffix='.js', delete=False) as f:
              f.write(script)
              name=f.name
          subprocess.run(['node', name], check=True)
          print('✓ Todos los formatos BNB fueron validados.')
          PY

      - name: Guardar cambios
        run: |
          if git diff --quiet -- index.html; then
            echo 'No hay cambios en index.html.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Normalizar importes BNB'
          git push
