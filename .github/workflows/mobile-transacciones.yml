name: Mobile transactions UI

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  mobile-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix mobile transaction cards
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py

      - name: Validate
        run: |
          grep -q 'tx-mobile-list' index.html
          grep -q 'Mobile transaction cards' index.html
          grep -q 'observer.disconnect' index.html

      - name: Commit
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: estabilizar vista móvil de transacciones'
          git push
