name: Ajustar backup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ajustar borrado de datos
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_confirm = "message:'Se eliminarán de forma permanente todas tus categorías, subcategorías, reglas, presupuestos y transacciones de esta cuenta. Esta acción no se puede deshacer.',"
          new_confirm = "message:'Se eliminarán de forma permanente todas tus transacciones de esta cuenta. Tus categorías, subcategorías, reglas y presupuestos se conservarán.',"
          old_detail = "detail:'Las credenciales de acceso NO se eliminan.',"
          new_detail = "detail:'Las categorías, subcategorías, reglas y presupuestos NO se eliminan. Las credenciales de acceso tampoco.',"

          old_delete = """      // Orden seguro respetando las relaciones: primero tablas hijas y luego categorías.\n      const tables=['presupuestos','reglas_categorizacion','transacciones','subcategorias','categorias'];\n      for(const table of tables){\n        const {error}=await supabaseClient.from(table).delete().eq('usuario_id',currentUser.id);\n        if(error) throw error;\n      }\n      state={categories:[],transactions:[],rules:[],budgets:{}};"""
          new_delete = """      // En Backup, borrar todos los datos elimina únicamente las transacciones.\n      const {error}=await supabaseClient.from('transacciones').delete().eq('usuario_id',currentUser.id);\n      if(error) throw error;\n      state.transactions=[];"""

          replacements = [
              (old_confirm, new_confirm),
              (old_detail, new_detail),
              (old_delete, new_delete),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'No se encontró el bloque esperado: {old[:100]}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          print('Backup ajustado correctamente.')

      - name: Guardar cambios
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No hay cambios que guardar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Backup: borrar solo transacciones"
          git push
