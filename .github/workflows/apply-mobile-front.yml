name: Apply mobile transactions front

on: push

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: python3 -c "import base64,zlib;exec(zlib.decompress(base64.b64decode(''))))"
      - name: Validate
        run: "grep -q 'tx-mobile-list' index.html && grep -q 'data-mobile-edit' index.html && grep -q 'data-mobile-del' index.html"
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: front móvil de transacciones con acciones funcionales'
          git pull --rebase origin main
          git push origin main
