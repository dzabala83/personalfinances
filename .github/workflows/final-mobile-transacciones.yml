name: Apply mobile Resumen format

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-summary-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar navegación del ajuste de presupuesto
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = s
          old_button = '<button class="budget-action-v2" type="button">Ajustes ›</button>'
          new_button = '<button class="budget-action-v2" type="button">Ajustes de presupuestos <span aria-hidden="true">›</span></button>'
          if old_button in s:
              s = s.replace(old_button, new_button, 1)
          elif new_button not in s:
              raise SystemExit('ERROR: no se encontró el botón de ajustes de presupuesto')
          old_click = "budgetCard.querySelector('.budget-action-v2').onclick=()=>{if(window.__goBudgetCategories)window.__goBudgetCategories();};"
          new_click = "budgetCard.querySelector('.budget-action-v2').onclick=()=>{currentTab='categorias';render();};"
          if old_click in s:
              s = s.replace(old_click, new_click, 1)
          elif new_click not in s:
              raise SystemExit('ERROR: no se encontró la acción del botón de ajustes de presupuesto')
          p.write_text(s, encoding='utf-8')
          print('changed:', s != original)
          PY
      - name: Validar
        run: |
          grep -q 'Ajustes de presupuestos' index.html
          grep -q "currentTab='categorias';render();" index.html
          test "$(grep -o 'function renderDashboardMobile(app)' index.html | wc -l)" -eq 1
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: botón de ajustes de presupuesto abre categorías'
          git push origin main
