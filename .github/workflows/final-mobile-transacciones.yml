name: Final mobile transactions UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final mobile cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'data-mobile-edit' in s and 'tx-mobile-polish-v2' in s:
              print('Final mobile UI already applied')
              raise SystemExit(0)
          old_css=re.compile(r'/\* ===== Vista móvil de transacciones ===== \*/.*?@media\(max-width:600px\)\{.*?#txListCard\{padding:10px;\}\n\}',re.S)
          new_css='''/* ===== Vista móvil de transacciones — tarjetas ===== */
          .tx-mobile-list{display:none;}
          .tx-mobile-card{border:1px solid var(--border);border-radius:16px;padding:14px 12px;margin:0 0 10px;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.03);}
          .tx-mobile-main{display:grid;grid-template-columns:48px 54px minmax(0,1fr) auto;gap:10px;align-items:center;}
          .tx-mobile-icon{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.15rem;background:var(--red-soft);color:var(--red);font-weight:800;}
          .tx-mobile-card.ingreso .tx-mobile-icon{background:var(--green-soft);color:var(--green);}
          .tx-mobile-datebox{width:54px;padding:6px 3px;border-radius:10px;background:var(--bg);text-align:center;font-weight:800;line-height:1.05;}
          .tx-mobile-datebox .mon{font-size:.65rem;color:var(--muted);text-transform:uppercase;}
          .tx-mobile-datebox .day{font-size:1.05rem;margin-top:2px;}
          .tx-mobile-info{min-width:0;}
          .tx-mobile-desc{font-weight:750;font-size:.88rem;line-height:1.25;overflow-wrap:anywhere;}
          .tx-mobile-sub{font-size:.75rem;color:var(--muted);margin-top:4px;overflow-wrap:anywhere;}
          .tx-mobile-amount{font-size:1rem;font-weight:800;white-space:nowrap;align-self:start;padding-top:2px;}
          .tx-mobile-amount.gasto{color:var(--red);}
          .tx-mobile-amount.ingreso{color:var(--green);}
          .tx-mobile-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px;padding-left:58px;}
          .tx-mobile-cat{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:14px;background:var(--red-soft);color:var(--red);font-size:.73rem;font-weight:700;max-width:65%;overflow-wrap:anywhere;}
          .tx-mobile-card.ingreso .tx-mobile-cat{background:var(--green-soft);color:var(--green);}
          .tx-mobile-actions{display:flex;gap:7px;}
          .tx-mobile-actions button{min-width:40px;min-height:38px;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:9px;font-size:1rem;cursor:pointer;}
          .tx-mobile-actions button:active{transform:scale(.96);}
          @media(max-width:600px){.tx-desktop-list{display:none!important;}.tx-mobile-list{display:block;}#txListCard{padding:10px;}#txListCard>.table-wrap{display:none!important;}}'''
          if not old_css.search(s): raise SystemExit('mobile CSS marker not found')
          s=old_css.sub(new_css,s,count=1)
          s=re.sub(r'\n<script>\n/\* Mobile transaction cards:.*?</script>\n(?=</body>)','\n',s,flags=re.S)
          needle="html+='</tbody></table></div>'; card.innerHTML=html;"
          replacement='''html+='</tbody></table></div>';
              const mobileList=document.createElement('div');
              mobileList.className='tx-mobile-list';
              list.forEach(t=>{
                const gasto=t.tipo==='Gasto';
                const d=new Date((t.fecha||'')+'T00:00:00');
                const monthNames=['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
                const mon=Number.isNaN(d.getTime()) ? '' : monthNames[d.getMonth()];
                const day=Number.isNaN(d.getTime()) ? (t.fecha||'').slice(-2) : String(d.getDate()).padStart(2,'0');
                const item=document.createElement('div');
                item.className='tx-mobile-card '+(gasto?'gasto':'ingreso');
                item.innerHTML=`<div class="tx-mobile-main"><div class="tx-mobile-icon">${gasto?'↑':'↓'}</div><div class="tx-mobile-datebox"><div class="mon">${mon}</div><div class="day">${day}</div></div><div class="tx-mobile-info"><div class="tx-mobile-desc"></div><div class="tx-mobile-sub"></div></div><div class="tx-mobile-amount ${gasto?'gasto':'ingreso'}">${gasto?'−':'+'}${fmtMoney(t.monto).replace(/^Bs\s*/,'')} Bs</div></div><div class="tx-mobile-bottom"><div class="tx-mobile-cat">🚗 ${escapeHtml(t.categoria||'Sin categoría')}${t.subcategoria?' · '+escapeHtml(t.subcategoria):''}</div><div class="tx-mobile-actions"><button type="button" data-mobile-edit="${escapeHtml(t.id)}" title="Editar">✏️</button><button type="button" data-mobile-del="${escapeHtml(t.id)}" title="Eliminar">🗑️</button></div></div>`;
                item.querySelector('.tx-mobile-desc').textContent=t.descripcion||'Sin descripción';
                item.querySelector('.tx-mobile-sub').textContent=t.categoria ? (t.categoria+(t.subcategoria?' / '+t.subcategoria:'')) : 'Sin categoría';
                mobileList.appendChild(item);
              });
              card.innerHTML=html;
              card.appendChild(mobileList);'''
          if needle not in s: raise SystemExit('render marker not found')
          s=s.replace(needle,replacement,1)
          old_bind="""    card.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEditTransaction(b.dataset.edit));
    card.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ const tx=state.transactions.find(t=>t.id===b.dataset.del); if(!tx) return; showDeleteTransactionModal(tx, async()=>{ const original=state.transactions.slice(); state.transactions=state.transactions.filter(t=>t.id!==tx.id); const result=await saveState(); if(!result.cloud){ state.transactions=original; throw (result.error||new Error('No se pudo sincronizar con Supabase')); } renderList(); renderNav(); showToast('Transacción eliminada y sincronizada.'); }); });"""
          new_bind="""    const editHandler=id=>openEditTransaction(id);
    const deleteHandler=id=>{ const tx=state.transactions.find(t=>t.id===id); if(!tx) return; showDeleteTransactionModal(tx, async()=>{ const original=state.transactions.slice(); state.transactions=state.transactions.filter(t=>t.id!==tx.id); const result=await saveState(); if(!result.cloud){ state.transactions=original; throw (result.error||new Error('No se pudo sincronizar con Supabase')); } renderList(); renderNav(); showToast('Transacción eliminada y sincronizada.'); }); };
    card.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editHandler(b.dataset.edit));
    card.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>deleteHandler(b.dataset.del));
    card.querySelectorAll('[data-mobile-edit]').forEach(b=>b.onclick=()=>editHandler(b.dataset.mobileEdit));
    card.querySelectorAll('[data-mobile-del]').forEach(b=>b.onclick=()=>deleteHandler(b.dataset.mobileDel));"""
          if old_bind not in s: raise SystemExit('binding marker not found')
          s=s.replace(old_bind,new_bind,1)
          extra='''<style id="tx-mobile-polish-v2">@media(max-width:600px){#txListCard{margin-top:10px;}.search-panel{grid-template-columns:1fr 1fr!important;gap:9px;}.search-panel .search-wide{grid-column:1 / -1;}.search-panel label{font-size:.72rem;}#txSearch{font-size:.9rem;padding:11px 12px;}#filterMonth,#filterTipo,#txCatFilter,#txSubFilter,#txAccountFilter,#txStatusFilter,#txDateFrom,#txDateTo,#txMinAmount,#txMaxAmount{min-height:42px;}#applyTxFilters,#clearTxFilters,#addManualBtn{min-height:44px;}}</style>'''
          s=s.replace('</head>',extra+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate source
        run: |
          grep -q 'tx-mobile-list' index.html
          grep -q 'data-mobile-edit' index.html
          grep -q 'data-mobile-del' index.html
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: front móvil de transacciones con acciones funcionales'
          git pull --rebase origin main
          git push origin main
