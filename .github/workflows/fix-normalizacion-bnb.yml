name: Corregir normalizacion BNB

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reemplazar parser
        env:
          OLD_B64: 
          NEW_B64: 
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old=base64.b64decode(os.environ['OLD_B64']).decode()
          new=base64.b64decode(os.environ['NEW_B64']).decode()
          if old not in s:
              raise SystemExit('No se encontro el parser anterior en index.html')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          print('Parser BNB corregido.')
          PY

      - name: Probar normalizacion
        run: |
          node - <<'JS'
          function parseAmount(v){
            if(v==='' || v==null) return 0;
            if(typeof v === 'number') return Number.isFinite(v) ? v : 0;
            let s=String(v).trim().replace(/[^\d.,-]/g,'');
            if(!s) return 0;
            const comma=s.lastIndexOf(','), dot=s.lastIndexOf('.');
            if(comma>=0 && dot>=0){
              if(comma>dot) s=s.replace(/\./g,'').replace(',', '.');
              else s=s.replace(/,/g,'');
            } else if(comma>=0){
              const p=s.split(','), last=p[p.length-1];
              s=(p.length>2 || last.length===3) ? p.join('') : s.replace(',', '.');
            } else if(dot>=0){
              const p=s.split('.'), last=p[p.length-1];
              if(p.length>2 || last.length===3) s=p.join('');
            }
            const n=Number(s); return Number.isFinite(n)?n:0;
          }
          const tests=[['4,322.53',4322.53],['4.322,53',4322.53],['4322.53',4322.53],['4322,53',4322.53],['24.50',24.5],['24,50',24.5],['1,500',1500],['1.500',1500],['1,500.00',1500],['1.500,00',1500],['4,322.53 Bs',4322.53],[4322.53,4322.53]];
          for(const [raw,expected] of tests){const got=parseAmount(raw);if(got!==expected)throw new Error(`${raw} => ${got}; esperado ${expected}`)}
          console.log('OK: normalizacion BNB validada.');
          JS

      - name: Guardar index corregido
        run: |
          if git diff --quiet -- index.html; then echo 'Sin cambios.'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: normalizar importes BNB correctamente'
          git push
