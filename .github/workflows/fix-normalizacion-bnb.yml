name: Corregir normalizacion BNB

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reemplazar parser BNB
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = s.index('function parseAmount(v){')
          end = s.index('\n}\n\nfunction parseDate', start) + 2
          new = '''function parseAmount(v){
  if(v==='' || v==null) return 0;
  if(typeof v === 'number') return Number.isFinite(v) ? v : 0;

  let s = String(v).trim().replace(/[^\\d.,-]/g,'');
  if(!s) return 0;

  // Algoritmo BNB solicitado:
  // 1) eliminar solamente la primera coma encontrada desde la derecha;
  // 2) convertir el punto restante en coma;
  // 3) usar punto internamente para convertir a Number.
  const comma = s.lastIndexOf(',');
  if(comma >= 0){
    s = s.slice(0, comma) + s.slice(comma + 1);
  }

  const dot = s.lastIndexOf('.');
  if(dot >= 0){
    s = s.slice(0, dot) + ',' + s.slice(dot + 1);
  }

  s = s.replace(',', '.');

  const n = Number(s);
  return Number.isFinite(n) ? n : 0;
}'''
          p.write_text(s[:start] + new + s[end:], encoding='utf-8')
          print('Parser BNB reemplazado.')
          PY

      - name: Validar parser
        run: |
          node - <<'JS'
          function parseAmount(v){
            if(v==='' || v==null) return 0;
            if(typeof v === 'number') return Number.isFinite(v) ? v : 0;
            let s=String(v).trim().replace(/[^\d.,-]/g,'');
            if(!s) return 0;
            const comma=s.lastIndexOf(',');
            if(comma>=0) s=s.slice(0,comma)+s.slice(comma+1);
            const dot=s.lastIndexOf('.');
            if(dot>=0) s=s.slice(0,dot)+','+s.slice(dot+1);
            s=s.replace(',', '.');
            const n=Number(s);
            return Number.isFinite(n)?n:0;
          }
          const tests=[
            ['4,322.53',4322.53],
            ['4322.53',4322.53],
            ['4322,53',432253],
            ['24.50',24.50],
            ['4,322.53 Bs',4322.53],
            [4322.53,4322.53]
          ];
          for(const [raw,expected] of tests){
            const got=parseAmount(raw);
            if(got!==expected) throw new Error(`${raw} => ${got}; esperado ${expected}`);
          }
          console.log('OK: algoritmo validado.');
          JS

      - name: Guardar index corregido
        run: |
          if git diff --quiet -- index.html; then
            echo 'Sin cambios en index.html.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: normalizar importes BNB con algoritmo simple'
          git push
