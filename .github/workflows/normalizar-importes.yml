name: Normalizar importes BNB

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  normalizar:
    if: ${{ !contains(github.event.head_commit.message, 'Normalizar importes BNB') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalizar parser de importes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old = '''function parseAmount(v){
            if(v===''||v==null) return 0;
            if(typeof v === 'number') return v;
            let s = String(v).trim().replace(/[^\\d.,-]/g,'');
            if(s.includes(',') && s.includes('.')){
              s = s.replace(/\\./g,'').replace(',','.');
            } else if(s.includes(',') && !s.includes('.')){
              s = s.replace(',','.');
            }
            const n = parseFloat(s);
            return isNaN(n) ? 0 : n;
          }'''

          new = '''function parseAmount(v){
            // Normaliza importes provenientes de Excel a un número JavaScript.
            // Soporta formatos BNB/internacionales como 4,322.53 y 4.322,53,
            // además de importes decimales simples como 24.50 o 24,50.
            if(v==='' || v==null) return 0;
            if(typeof v === 'number') return Number.isFinite(v) ? v : 0;

            let s = String(v)
              .trim()
              .replace(/\\u00A0/g,' ')
              .replace(/[^\\d.,-]/g,'');
            if(!s) return 0;

            const comma = s.lastIndexOf(',');
            const dot = s.lastIndexOf('.');

            // Con ambos separadores, el último es el decimal.
            if(comma >= 0 && dot >= 0){
              if(comma > dot){
                // 4.322,53 -> 4322.53
                s = s.replace(/\\./g,'').replace(',', '.');
              }else{
                // 4,322.53 -> 4322.53
                s = s.replace(/,/g,'');
              }
            }
            // Solo coma: 24,50 = decimal; 1,500 = miles.
            else if(comma >= 0){
              const parts = s.split(',');
              const last = parts[parts.length-1];
              if(parts.length > 2 || last.length === 3){
                s = parts.join('');
              }else{
                s = s.replace(',', '.');
              }
            }
            // Solo punto: 24.50 = decimal; 1.500 = miles.
            else if(dot >= 0){
              const parts = s.split('.');
              const last = parts[parts.length-1];
              if(parts.length > 2 || last.length === 3){
                s = parts.join('');
              }
            }

            const n = Number(s);
            return Number.isFinite(n) ? n : 0;
          }'''

          if old not in text:
              raise SystemExit('No se encontró el parser original esperado en index.html')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          print('Parser reemplazado correctamente.')
          PY

      - name: Probar formatos BNB
        run: |
          node <<'NODE'
          function parseAmount(v){
            if(v==='' || v==null) return 0;
            if(typeof v === 'number') return Number.isFinite(v) ? v : 0;
            let s = String(v).trim().replace(/\u00A0/g,' ').replace(/[^\d.,-]/g,'');
            if(!s) return 0;
            const comma=s.lastIndexOf(','), dot=s.lastIndexOf('.');
            if(comma>=0 && dot>=0){
              if(comma>dot) s=s.replace(/\./g,'').replace(',','.');
              else s=s.replace(/,/g,'');
            } else if(comma>=0){
              const p=s.split(','), last=p[p.length-1];
              if(p.length>2 || last.length===3) s=p.join('');
              else s=s.replace(',','.');
            } else if(dot>=0){
              const p=s.split('.'), last=p[p.length-1];
              if(p.length>2 || last.length===3) s=p.join('');
            }
            const n=Number(s);
            return Number.isFinite(n) ? n : 0;
          }
          const cases={
            '4,322.53':4322.53,
            '1,500.00':1500,
            '3,874.88':3874.88,
            '521.33':521.33,
            '4.322,53':4322.53,
            '1.500,00':1500,
            '24,50':24.50,
            '24.50':24.50,
            '1,500':1500,
            '1.500':1500
          };
          for(const [input,expected] of Object.entries(cases)){
            const got=parseAmount(input);
            if(got!==expected) throw new Error(`${input} => ${got}; esperado ${expected}`);
          }
          console.log('Todas las pruebas de importes BNB pasaron.');
          NODE

      - name: Guardar cambio en index.html
        run: |
          if git diff --quiet -- index.html; then
            echo 'No hay cambios en index.html.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Normalizar importes BNB'
          git push
