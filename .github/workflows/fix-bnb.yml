name: Fix BNB amounts

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace parser
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = s.index('function parseAmount(v){')
          end = s.index('\n}\n\nfunction parseDate', start) + 2
          new = '''function parseAmount(v){
  if(v==='' || v==null) return 0;
  if(typeof v === 'number') return Number.isFinite(v) ? v : 0;
  let s = String(v).trim().replace(/[^\\d.,-]/g,'');
  if(!s) return 0;
  const comma = s.lastIndexOf(',');
  if(comma >= 0) s = s.slice(0, comma) + s.slice(comma + 1);
  const dot = s.lastIndexOf('.');
  if(dot >= 0) s = s.slice(0, dot) + ',' + s.slice(dot + 1);
  s = s.replace(',', '.');
  const n = Number(s);
  return Number.isFinite(n) ? n : 0;
}'''
          p.write_text(s[:start] + new + s[end:], encoding='utf-8')
          print('Parser replaced')
          PY

      - name: Validate
        run: |
          node - <<'JS'
          function parseAmount(v){
            if(v==='' || v==null) return 0;
            if(typeof v === 'number') return Number.isFinite(v) ? v : 0;
            let s=String(v).trim().replace(/[^\d.,-]/g,'');
            if(!s) return 0;
            const comma=s.lastIndexOf(',');
            if(comma>=0) s=s.slice(0,comma)+s.slice(comma+1);
            const dot=s.lastIndexOf('.');
            if(dot>=0) s=s.slice(0,dot)+','+s.slice(dot+1);
            s=s.replace(',', '.');
            const n=Number(s);
            return Number.isFinite(n)?n:0;
          }
          if(parseAmount('4,322.53') !== 4322.53) throw new Error('4,322.53 failed');
          if(parseAmount(4322.53) !== 4322.53) throw new Error('numeric failed');
          console.log('Parser validation OK');
          JS

      - name: Commit
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: normalizar importes BNB'
          git push
