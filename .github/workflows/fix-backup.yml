name: Corregir borrado de transacciones
on:
  push:
    paths:
      - '.github/workflows/fix-backup.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar corrección definitiva
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* FIX BACKUP: borrar solo transacciones */'
          if marker in s:
              print('La corrección ya existe.')
              raise SystemExit(0)
          script = r'''<script>
          /* FIX BACKUP: borrar solo transacciones */
          document.addEventListener('click', async (event) => {
            const btn = event.target.closest('#resetBtn');
            if (!btn) return;
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();
            if (!currentUser) {
              showToast('Debes iniciar sesión para borrar los datos.');
              return;
            }
            const ok = await showTimedDeleteConfirm({
              title:'Borrar todos los datos',
              message:'Se eliminarán de forma permanente todas las transacciones de esta cuenta. Tus categorías, subcategorías, reglas y presupuestos permanecerán intactos.',
              detail:'Las credenciales de acceso NO se eliminan.',
              confirmText:'Borrar todas las transacciones'
            });
            if (!ok) return;
            btn.disabled = true;
            btn.textContent = 'Borrando…';
            try {
              const { error } = await supabaseClient
                .from('transacciones')
                .delete()
                .eq('usuario_id', currentUser.id);
              if (error) throw error;
              state.transactions = [];
              saveLocal();
              cloudActive = true;
              showToast('Todas las transacciones fueron eliminadas');
              currentTab = 'dashboard';
              render();
            } catch (err) {
              console.error('Error borrando transacciones:', err);
              showToast('No se pudieron borrar las transacciones de la nube');
            } finally {
              btn.disabled = false;
              btn.textContent = 'Borrar todos los datos';
            }
          }, true);
          </script>'''
          if '</body>' not in s:
              raise SystemExit('No se encontró </body>')
          s = s.replace('</body>', script + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          print('Corrección insertada.')
          PY
      - name: Commit si hubo cambios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Sin cambios para guardar.'
          else
            git commit -m 'fix: borrar solo transacciones desde backup'
            git push
          fi
