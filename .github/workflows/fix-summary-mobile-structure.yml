name: Fix summary mobile structure
on: [push]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar parche estructural
        env:
          PATCH_B64: ""
        run: |
          echo "$PATCH_B64" | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Validar
        run: |
          grep -q 'function renderDashboardMobile(app)' index.html
          grep -q 'summary-mobile-v2' index.html
          ! grep -q 'SUMMARY_MOBILE_V1' index.html
          ! grep -q 'summary-mobile-v1' index.html
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: resumen móvil usa un solo render sin parpadeo'
          git push origin main
