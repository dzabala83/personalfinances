<style>
:root{
  --bg:#f5f6fa; --card:#ffffff; --text:#1a1c23; --muted:#6b7280; --border:#e5e7eb;
  --accent:#2563eb; --accent-soft:#dbeafe; --green:#16a34a; --green-soft:#dcfce7;
  --yellow:#d97706; --yellow-soft:#fef3c7; --red:#dc2626; --red-soft:#fee2e2;
  --income:#0891b2; --income-soft:#cffafe;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111318; --card:#1a1d24; --text:#e8e9ec; --muted:#9aa0ab; --border:#2b2f38;
    --accent:#60a5fa; --accent-soft:#1e3a5f; --green:#4ade80; --green-soft:#14432a;
    --yellow:#fbbf24; --yellow-soft:#4a3a12; --red:#f87171; --red-soft:#4a1d1d;
    --income:#22d3ee; --income-soft:#0e3a44;
  }
}
:root[data-theme="dark"]{
  --bg:#111318; --card:#1a1d24; --text:#e8e9ec; --muted:#9aa0ab; --border:#2b2f38;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --green:#4ade80; --green-soft:#14432a;
  --yellow:#fbbf24; --yellow-soft:#4a3a12; --red:#f87171; --red-soft:#4a1d1d;
  --income:#22d3ee; --income-soft:#0e3a44;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:40px;
}
header{
  padding:20px 16px 12px; text-align:center; border-bottom:1px solid var(--border);
  background:var(--card);
}
header h1{margin:0 0 4px; font-size:1.4rem;}
header p{margin:0; color:var(--muted); font-size:0.85rem;}
nav{
  display:flex; gap:6px; overflow-x:auto; padding:10px 12px; background:var(--card);
  border-bottom:1px solid var(--border); position:sticky; top:0; z-index:10;
}
nav button{
  flex:0 0 auto; padding:8px 14px; border-radius:20px; border:1px solid var(--border);
  background:var(--bg); color:var(--text); font-size:0.85rem; cursor:pointer; white-space:nowrap;
  position:relative;
}
nav button.active{background:var(--accent); color:#fff; border-color:var(--accent);}
nav button .badge{
  background:var(--red); color:#fff; border-radius:10px; font-size:0.65rem; padding:1px 6px;
  margin-left:6px;
}
main{max-width:900px; margin:0 auto; padding:16px;}
.card{
  background:var(--card); border:1px solid var(--border); border-radius:14px;
  padding:16px; margin-bottom:14px;
}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
@media (max-width:520px){.grid3{grid-template-columns:1fr;}}
.stat{text-align:center;}
.stat .label{font-size:0.75rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.03em;}
.stat .value{font-size:1.4rem; font-weight:700; margin-top:2px;}
.month-nav{display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:14px;}
.month-nav button{
  border:1px solid var(--border); background:var(--card); color:var(--text); border-radius:8px;
  width:34px; height:34px; font-size:1rem; cursor:pointer;
}
.month-nav .label{font-weight:600; min-width:150px; text-align:center;}
h2.section-title{font-size:1rem; margin:22px 0 10px;}
h3.cat-title{font-size:0.95rem; margin:0 0 8px; display:flex; justify-content:space-between; align-items:center;}
.bar-row{margin-bottom:14px;}
.bar-track{
  background:var(--border); border-radius:8px; height:10px; overflow:hidden; margin-top:4px;
}
.bar-fill{height:100%; border-radius:8px; transition:width .3s;}
.bar-meta{display:flex; justify-content:space-between; font-size:0.78rem; color:var(--muted); margin-top:3px;}
.pct-ok{background:var(--green);} .pct-warn{background:var(--yellow);} .pct-over{background:var(--red);}
.alert{
  display:flex; gap:8px; align-items:flex-start; padding:10px 12px; border-radius:10px;
  margin-bottom:8px; font-size:0.85rem;
}
.alert.warn{background:var(--yellow-soft); color:var(--yellow);}
.alert.danger{background:var(--red-soft); color:var(--red);}
.alert.ok{background:var(--green-soft); color:var(--green);}
table{width:100%; border-collapse:collapse; font-size:0.85rem;}
.table-wrap{overflow-x:auto;}
th,td{padding:8px 6px; text-align:left; border-bottom:1px solid var(--border); white-space:nowrap;}
th{color:var(--muted); font-weight:600; font-size:0.75rem; text-transform:uppercase;}
tr:last-child td{border-bottom:none;}
select,input[type=text],input[type=number],input[type=date]{
  padding:8px 10px; border-radius:8px; border:1px solid var(--border); background:var(--bg);
  color:var(--text); font-size:0.9rem; width:100%;
}
label{font-size:0.78rem; color:var(--muted); display:block; margin-bottom:4px;}
.field{margin-bottom:10px;}
button.btn{
  background:var(--accent); color:#fff; border:none; border-radius:9px; padding:10px 16px;
  font-size:0.88rem; cursor:pointer; font-weight:600;
}
button.btn.secondary{background:var(--bg); color:var(--text); border:1px solid var(--border);}
button.btn.danger{background:var(--red); color:#fff;}
button.btn:disabled{opacity:0.5; cursor:not-allowed;}
.row-actions{display:flex; gap:6px;}
.row-actions button{
  border:1px solid var(--border); background:var(--bg); color:var(--text); border-radius:6px;
  padding:4px 8px; font-size:0.75rem; cursor:pointer;
}
.pill{
  display:inline-block; padding:2px 9px; border-radius:12px; font-size:0.72rem; font-weight:600;
}
.pill.gasto{background:var(--red-soft); color:var(--red);}
.pill.ingreso{background:var(--green-soft); color:var(--green);}
.tag-cat{
  display:flex; align-items:center; justify-content:space-between; padding:8px 10px;
  border:1px solid var(--border); border-radius:9px; margin-bottom:8px; flex-wrap:wrap; gap:8px;
}
.sub-list{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;}
.sub-chip{
  background:var(--bg); border:1px solid var(--border); border-radius:14px; padding:3px 10px;
  font-size:0.75rem; display:flex; align-items:center; gap:6px;
}
.sub-chip button{border:none; background:none; color:var(--muted); cursor:pointer; font-size:0.85rem;}
.empty{text-align:center; color:var(--muted); padding:24px 12px; font-size:0.9rem;}
.upload-drop{
  border:2px dashed var(--border); border-radius:14px; padding:30px 16px; text-align:center;
  cursor:pointer; color:var(--muted);
}
.upload-drop:hover{border-color:var(--accent); color:var(--accent);}
.hidden{display:none !important;}
.pending-item{border:1px solid var(--border); border-radius:10px; padding:10px; margin-bottom:10px;}
.pending-item .desc{font-weight:600; font-size:0.9rem; margin-bottom:2px;}
.pending-item .meta{font-size:0.78rem; color:var(--muted); margin-bottom:8px;}
.inline-form{display:flex; gap:6px; flex-wrap:wrap;}
.inline-form > div{flex:1; min-width:120px;}
.toast{
  position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--text);
  color:var(--bg); padding:10px 18px; border-radius:20px; font-size:0.85rem; z-index:100;
  opacity:0; transition:opacity .3s; pointer-events:none;
}
.toast.show{opacity:1;}
.footer-note{text-align:center; color:var(--muted); font-size:0.75rem; margin-top:20px;}
canvas{max-height:260px;}

  .search-panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end;margin-top:12px;}
  .search-panel .field{margin:0;}
  .search-wide{grid-column:span 2;}
  @media(max-width:600px){.search-wide{grid-column:span 1;}}
</style>

<style>
.d-spinner{display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:1rem;line-height:1;animation:d-spin .8s linear infinite;transform-origin:center;}
@keyframes d-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
</style>

  const subRows=[];
  seed.categories.forEach(c=>{
    const catId=catIdByKey[c.tipo+'|'+c.nombre];
    (c.subcategorias||[]).forEach(name=>{
      const id=crypto.randomUUID();
      subIdByCatName[catId+'|'+name]=id;
      subRows.push({id,usuario_id:user_id,categoria_id:catId,nombre:name});
    });
  });
  if(subRows.length){
    r=await supabaseClient.from('subcategorias').insert(subRows);
    if(r.error) throw new Error('subcategorias: '+r.error.message);
  }

  const ruleRows=(seed.rules||[]).map(x=>({
    id:crypto.randomUUID(), usuario_id:user_id, palabra_clave:x.keyword,
    categoria_id:catIdByKey[x.tipo+'|'+x.categoria]||null,
    subcategoria_id:x.subcategoria ? (subIdByCatName[catIdByKey[x.tipo+'|'+x.categoria]+'|'+x.subcategoria]||null) : null
  }));
  if(ruleRows.length){
    r=await supabaseClient.from('reglas_categorizacion').insert(ruleRows);
    if(r.error) throw new Error('reglas: '+r.error.message);
  }

  const txRows=(seed.transactions||[]).map(t=>({
    id:crypto.randomUUID(), usuario_id:user_id, fecha:t.fecha, descripcion:t.descripcion,
    monto:Number(t.monto)||0, tipo:t.tipo,
    categoria_id:catIdByKey[t.tipo+'|'+t.categoria]||null,
    subcategoria_id:t.subcategoria ? (subIdByCatName[(catIdByKey[t.tipo+'|'+t.categoria]||'')+'|'+t.subcategoria]||null) : null,
    cuenta:t.cuenta||null, origen:t.origen||null, estado:t.estado||'categorizado',
    referencia_id:t.refId||null, metadata:{}
  }));
  if(txRows.length){
    r=await supabaseClient.from('transacciones').insert(txRows);
    if(r.error) throw new Error('transacciones: '+r.error.message);
  }
  return seed;
}
async function auditSupabaseConnection(){
  if(!currentUser) throw new Error('No hay una sesión de Supabase activa.');
  const {data,error}=await supabaseClient.from('categorias').select('id').eq('usuario_id',currentUser.id).limit(1);
  if(error) throw new Error('Lectura Supabase falló: '+error.message);
  return true;
}

async function saveState(){
  // Guardado local inmediato. La nube recibe SOLO los registros que cambiaron.
  saveLocal();
  if(!currentUser) return {cloud:false};

  const same = (a,b) => JSON.stringify(a) === JSON.stringify(b);

  try{
    const user_id=currentUser.id;

    // --- Categorías y subcategorías ---
    const {data:existingCats,error:eCats}=await supabaseClient
      .from('categorias').select('id,tipo,nombre').eq('usuario_id',user_id);
    if(eCats) throw eCats;

    const catByKey=Object.fromEntries((existingCats||[]).map(c=>[c.tipo+'|'+c.nombre,c.id]));
    const catRows=[];
    for(const c of state.categories){
      const key=c.tipo+'|'+c.nombre;
      const id=catByKey[key] || (UUID_RE.test(c.id||'') ? c.id : crypto.randomUUID());
      c.id=id;
      catByKey[key]=id;
      catRows.push({id,usuario_id:user_id,nombre:c.nombre,tipo:c.tipo});
    }
    if(catRows.length){
      const r=await supabaseClient.from('categorias').upsert(catRows,{onConflict:'id'});
      if(r.error) throw r.error;
    }

    const {data:existingSubs,error:eSubs}=await supabaseClient
      .from('subcategorias').select('id,categoria_id,nombre').eq('usuario_id',user_id);
    if(eSubs) throw eSubs;

    const subMap={};
    const existingSubMap=Object.fromEntries(
      (existingSubs||[]).map(x=>[x.categoria_id+'|'+x.nombre,x.id])
    );
    const subRows=[];
    state.categories.forEach(c=>{
      const catId=catByKey[c.tipo+'|'+c.nombre];
      (c.subcategorias||[]).forEach(name=>{
        const key=catId+'|'+name;
        const id=existingSubMap[key] || crypto.randomUUID();
        subMap[key]=id;
        if(!existingSubMap[key]) existingSubMap[key]=id;
        subRows.push({id,usuario_id:user_id,categoria_id:catId,nombre:name});
      });
    });
    if(subRows.length){
      const r=await supabaseClient.from('subcategorias').upsert(subRows,{onConflict:'id'});
      if(r.error) throw r.error;
    }

    // --- Reglas: solo insertamos reglas nuevas. No reconstruimos las 122 existentes. ---
    const existingRuleIds=new Set((cloudSnapshot?.rules||[]).map(r=>r.id));
    const newRuleRows=[];
    (state.rules||[]).forEach(x=>{
      if(UUID_RE.test(x.id||'') && existingRuleIds.has(x.id)) return;
      const id=UUID_RE.test(x.id||'') ? x.id : crypto.randomUUID();
      x.id=id;
      newRuleRows.push({
        id,usuario_id:user_id,palabra_clave:x.keyword,
        categoria_id:catByKey[x.tipo+'|'+x.categoria]||null,
        subcategoria_id:x.subcategoria
          ? (subMap[(catByKey[x.tipo+'|'+x.categoria]||'')+'|'+x.subcategoria]||null)
          : null
      });
    });
    if(newRuleRows.length){
      const r=await supabaseClient.from('reglas_categorizacion').upsert(newRuleRows,{onConflict:'id'});
      if(r.error) throw r.error;
    }

    // --- Transacciones: SOLO nuevas o modificadas ---
    const previousTx=cloudSnapshot?.transactions||[];
    const previousById=Object.fromEntries(previousTx.map(t=>[t.id,t]));
    const txRows=[];
    const currentIds=new Set();

    for(const tx of (state.transactions||[])){
      let id=tx.id;
      if(!UUID_RE.test(id||'')){
        id=crypto.randomUUID();
        tx.id=id;
      }
      currentIds.add(id);

      const row={
        id,usuario_id:user_id,fecha:tx.fecha,descripcion:tx.descripcion,
        monto:Number(tx.monto)||0,tipo:tx.tipo,
        categoria_id:catByKey[tx.tipo+'|'+tx.categoria]||null,
        subcategoria_id:tx.subcategoria
          ? (subMap[(catByKey[tx.tipo+'|'+tx.categoria]||'')+'|'+tx.subcategoria]||null)
          : null,
        cuenta:tx.cuenta||null,origen:tx.origen||null,
        estado:tx.estado||'categorizado',
        referencia_id:tx.refId||null,metadata:{}
      };
      const old=previousById[id];
      if(!old || !same(
        {fecha:old.fecha,descripcion:old.descripcion,monto:Number(old.monto)||0,tipo:old.tipo,
         categoria:old.categoria,subcategoria:old.subcategoria,cuenta:old.cuenta,origen:old.origen,
         estado:old.estado,refId:old.refId||null},
        {fecha:tx.fecha,descripcion:tx.descripcion,monto:Number(tx.monto)||0,tipo:tx.tipo,
         categoria:tx.categoria,subcategoria:tx.subcategoria,cuenta:tx.cuenta,origen:tx.origen,
         estado:tx.estado,refId:tx.refId||null}
      )){
        txRows.push(row);
      }
    }

    if(txRows.length){
      const r=await supabaseClient.from('transacciones').upsert(txRows,{onConflict:'id'});
      if(r.error) throw r.error;
    }

    // Si ya tenemos una foto fiable de la nube, eliminamos SOLO transacciones
    // que el usuario realmente haya borrado.
    if(cloudSnapshot?.transactions){
      const deletedIds=previousTx.map(t=>t.id).filter(id=>!currentIds.has(id));
      if(deletedIds.length){
        const r=await supabaseClient.from('transacciones')
          .delete().eq('usuario_id',user_id).in('id',deletedIds);
        if(r.error) throw r.error;
      }
    }

    // --- Presupuestos del mes actual ---
    // Se sincronizan únicamente cuando cambió el contenido de presupuestos.
    const budgetSignature=JSON.stringify((state.categories||[]).map(c=>({
      id:c.id,p:c.presupuesto||0,s:c.subPresupuestos||{}
    })));
    if(budgetSignature !== cloudSnapshot?.budgetSignature){
      const rDel=await supabaseClient.from('presupuestos')
        .delete().eq('usuario_id',user_id).eq('mes',currentMonth+'-01');
      if(rDel.error) throw new Error('presupuestos DELETE: '+rDel.error.message);

      const budgetRows=[];
      state.categories.forEach(c=>{
        const catId=catByKey[c.tipo+'|'+c.nombre];
        if(c.subcategorias?.length){
          c.subcategorias.forEach(name=>{
            const monto=Number(c.subPresupuestos?.[name])||0;
            if(monto>0) budgetRows.push({
              id:crypto.randomUUID(),usuario_id:user_id,categoria_id:catId,
              subcategoria_id:subMap[catId+'|'+name]||null,mes:currentMonth+'-01',monto
            });
          });
        }else if(Number(c.presupuesto)>0){
          budgetRows.push({
            id:crypto.randomUUID(),usuario_id:user_id,categoria_id:catId,
            subcategoria_id:null,mes:currentMonth+'-01',monto:Number(c.presupuesto)
          });
        }
      });
      if(budgetRows.length){
        const r=await supabaseClient.from('presupuestos').insert(budgetRows);
        if(r.error) throw r.error;
      }
    }

    // Actualizamos la foto local de nube después de confirmar todo.
    cloudSnapshot={
      transactions:(state.transactions||[]).map(t=>({...t})),
      rules:(state.rules||[]).map(r=>({...r})),
      budgetSignature
    };
    saveLocal();
    cloudActive=true;
    return {cloud:true};
  }catch(error){
    console.error('Error sincronizando con Supabase:',error);
    cloudActive=false;
    return {cloud:false,error};
  }
}

async function initApp(){
  const appEl=document.getElementById('app');
  appEl.innerHTML='<div class="card"><div class="empty">☁️ Conectando con tus datos…</div></div>';
  try{
    // Primero intentamos cargar lo que ya existe en Supabase.
    // Si la cuenta está vacía, NO bloqueamos la aplicación mientras
    // se sube la información inicial.
    const cloudData=await loadFromSupabase();
    if(cloudData){
      state=cloudData;
      cloudSnapshot={
        transactions:(state.transactions||[]).map(t=>({...t})),
        rules:(state.rules||[]).map(r=>({...r})),
        budgetSignature:JSON.stringify((state.categories||[]).map(c=>({id:c.id,p:c.presupuesto||0,s:c.subPresupuestos||{}})))
      };
      cloudActive=true;
      saveLocal();
      migrateState(state);
      finishInit();
      render();
      return;
    }

    // Primera entrada: mostrar la aplicación inmediatamente.
    const local=loadLocal();
    state=local||buildSeedState();
    migrateState(state);
    finishInit();
    render();
    cloudActive=false;
    renderNav();

    // La carga inicial a Supabase ocurre en segundo plano.
    if(!local){
      showToast('Preparando sincronización inicial…');
      seedToSupabase(state).then(async ()=>{
        const fresh=await loadFromSupabase();
        if(fresh){
          state=fresh;
          cloudSnapshot={
            transactions:(state.transactions||[]).map(t=>({...t})),
            rules:(state.rules||[]).map(r=>({...r})),
            budgetSignature:JSON.stringify((state.categories||[]).map(c=>({id:c.id,p:c.presupuesto||0,s:c.subPresupuestos||{}})))
          };
          saveLocal();
        }
        cloudActive=true;
        renderNav();
        showToast('Datos iniciales sincronizados ✓');
      }).catch(err=>{
        console.error('Error sincronizando datos iniciales:',err);
        cloudActive=false;
        renderNav();
        showToast('La app está funcionando en modo local.');
      });
    } else {
      saveState().then(result=>{
        if(result?.cloud){ cloudActive=true; renderNav(); }
      });
    }
  }catch(e){
    console.error('Error cargando datos:',e);
    state=loadLocal()||buildSeedState();
    migrateState(state);
    cloudActive=false;
    finishInit();
    render();
    showToast('No se pudo conectar a la nube. Usando datos locales.');
  }
}

function uid(prefix){
  return prefix+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 3200);
}

/* ================= UTIL ================= */
function fmtMoney(n){
  const v = Number(n)||0;
  return 'Bs ' + v.toLocaleString('es-BO', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function normalize(s){
  return (s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function monthKey(dateStr){ return (dateStr||'').slice(0,7); }
function monthLabel(key){
  const [y,m] = key.split('-').map(Number);
  const meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  return meses[m-1]+' '+y;
}
function todayKey(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function shiftMonth(key, delta){
  let [y,m] = key.split('-').map(Number);
  m += delta;
  while(m>12){m-=12; y+=1;}
  while(m<1){m+=12; y-=1;}
  return y+'-'+String(m).padStart(2,'0');
}

function getCategory(tipo, nombre){
  return state.categories.find(c=>c.tipo===tipo && c.nombre===nombre);
}

/* ================= APP STATE ================= */
let currentTab = 'dashboard';
let currentMonth = todayKey();

// Runs once state (local or cloud) is ready: jumps to the most recent month with data.
function finishInit(){
  const months = state.transactions.map(t=>monthKey(t.fecha)).filter(Boolean).sort();
  if(months.length && !months.includes(currentMonth)){
    currentMonth = months[months.length-1];
  }
}

const TABS = [
  {id:'dashboard', label:'📊 Resumen'},
  {id:'transacciones', label:'📄 Transacciones'},
  {id:'pendientes', label:'❓ Pendientes'},
  {id:'categorias', label:'🏷️ Categorías'},
  {id:'subir', label:'⬆️ Subir extracto'},
  {id:'backup', label:'💾 Backup'}
];

function pendingCount(){
  return state.transactions.filter(t=>t.estado==='pendiente').length;
}

function renderNav(){
  const nav = document.getElementById('tabNav');
  nav.innerHTML = '';
  TABS.forEach(tab=>{
    const btn = document.createElement('button');
    btn.className = tab.id===currentTab ? 'active' : '';
    let html = tab.label;
    if(tab.id==='pendientes' && pendingCount()>0){
      html += ' <span class="badge">'+pendingCount()+'</span>';
    }
    btn.innerHTML = html;
    btn.onclick = ()=>{ currentTab = tab.id; render(); };
    nav.appendChild(btn);
  });
}

function render(){
  renderNav();
  const sub = document.getElementById('headerSub');
  if(sub){
    sub.textContent = cloudActive
      ? '☁️ Sincronizado — funciona en cualquier dispositivo'
      : '📱 Guardado solo en este navegador';
  }
  const app = document.getElementById('app');
  app.innerHTML = '';
  if(currentTab==='dashboard') renderDashboard(app);
  else if(currentTab==='transacciones') renderTransacciones(app);
  else if(currentTab==='pendientes') renderPendientes(app);
  else if(currentTab==='categorias') renderCategorias(app);
  else if(currentTab==='subir') renderSubir(app);
  else if(currentTab==='backup') renderBackup(app);
}

/* ================= DASHBOARD ================= */
function renderDashboard(app){
  const wrap = document.createElement('div');

  // month nav
  const mn = document.createElement('div');
  mn.className = 'month-nav';
  mn.innerHTML = `
    <button id="prevM">←</button>
    <div class="label">${monthLabel(currentMonth)}</div>
    <button id="nextM">→</button>
  `;
  wrap.appendChild(mn);

  const txMonth = state.transactions.filter(t=>monthKey(t.fecha)===currentMonth);
  const ingresos = txMonth.filter(t=>t.tipo==='Ingreso').reduce((s,t)=>s+Number(t.monto),0);
  const gastos = txMonth.filter(t=>t.tipo==='Gasto').reduce((s,t)=>s+Number(t.monto),0);
  const balance = ingresos - gastos;

  const summary = document.createElement('div');
  summary.className = 'card grid3';
  summary.innerHTML = `
    <div class="stat"><div class="label">Ingresos</div><div class="value" style="color:var(--green)">${fmtMoney(ingresos)}</div></div>
    <div class="stat"><div class="label">Gastos</div><div class="value" style="color:var(--red)">${fmtMoney(gastos)}</div></div>
    <div class="stat"><div class="label">Balance</div><div class="value" style="color:${balance>=0?'var(--green)':'var(--red)'}">${fmtMoney(balance)}</div></div>
  `;
  wrap.appendChild(summary);

  // Alerts
  const alerts = [];
  const gastoCats = state.categories.filter(c=>c.tipo==='Gasto' && categoryBudget(c)>0);
  gastoCats.forEach(c=>{
    const budget = categoryBudget(c);
    const spent = txMonth.filter(t=>t.tipo==='Gasto' && t.categoria===c.nombre).reduce((s,t)=>s+Number(t.monto),0);
    const pct = spent/budget*100;
    if(pct>=100) alerts.push({level:'danger', msg:`Superaste el presupuesto de <b>${c.nombre}</b>: ${fmtMoney(spent)} de ${fmtMoney(budget)} (${pct.toFixed(0)}%)`});
    else if(pct>=90) alerts.push({level:'warn', msg:`<b>${c.nombre}</b> está casi en el límite: ${pct.toFixed(0)}% del presupuesto usado`});
  });
  if(gastos>0 && ingresos>0 && gastos>ingresos){
    alerts.push({level:'danger', msg:`Tus gastos del mes (${fmtMoney(gastos)}) superan tus ingresos (${fmtMoney(ingresos)})`});
  }
  if(pendingCount()>0){
    alerts.push({level:'warn', msg:`Tienes <b>${pendingCount()}</b> transacción(es) pendientes de categorizar`});
  }
  if(alerts.length===0 && txMonth.length>0){
    alerts.push({level:'ok', msg:'Todo en orden: sin alertas de presupuesto este mes 🎉'});
  }
  if(alerts.length){
    const alertCard = document.createElement('div');
    alertCard.className = 'card';
    alertCard.innerHTML = '<h3 class="cat-title">Alertas</h3>';
    alerts.forEach(a=>{
      const d = document.createElement('div');
      d.className = 'alert '+a.level;
      d.innerHTML = (a.level==='danger'?'🚨 ':a.level==='warn'?'⚠️ ':'✅ ')+a.msg;
      alertCard.appendChild(d);
    });
    wrap.appendChild(alertCard);
  }

  // Budget vs actual - Gastos
  const budgetCard = document.createElement('div');
  budgetCard.className = 'card';
  budgetCard.innerHTML = '<h3 class="cat-title">Presupuesto vs. gasto real</h3>';
  const gastoAll = state.categories.filter(c=>c.tipo==='Gasto');
  if(gastoAll.length===0){
    budgetCard.innerHTML += '<div class="empty">Aún no tienes categorías de gasto. Ve a la pestaña Categorías.</div>';
  } else {
    gastoAll.sort((a,b)=>{
      const sa = txMonth.filter(t=>t.categoria===a.nombre && t.tipo==='Gasto').reduce((s,t)=>s+Number(t.monto),0);
      const sb = txMonth.filter(t=>t.categoria===b.nombre && t.tipo==='Gasto').reduce((s,t)=>s+Number(t.monto),0);
      return sb-sa;
    }).forEach(c=>{
      const spent = txMonth.filter(t=>t.categoria===c.nombre && t.tipo==='Gasto').reduce((s,t)=>s+Number(t.monto),0);
      const budget = categoryBudget(c);
      if(spent===0 && budget===0) return;
      const pct = budget>0 ? Math.min(spent/budget*100,100) : (spent>0?100:0);
      const pctClass = budget===0 ? 'pct-warn' : (spent/budget>=1?'pct-over':(spent/budget>=0.9?'pct-warn':'pct-ok'));
      const row = document.createElement('div');
      row.className = 'bar-row';
      row.innerHTML = `
        <div class="bar-meta"><span>${c.nombre}</span><span>${fmtMoney(spent)}${budget>0?' / '+fmtMoney(budget):' (sin presupuesto)'}</span></div>
        <div class="bar-track"><div class="bar-fill ${pctClass}" style="width:${pct}%"></div></div>
      `;
      budgetCard.appendChild(row);

      // Subcategory breakdown, only when the category has subcategory budgets set
      const subBudgets = c.subPresupuestos || {};
      const hasSubBudgets = (c.subcategorias||[]).some(s=>Number(subBudgets[s])>0);
      if(hasSubBudgets){
        const subWrap = document.createElement('div');
        subWrap.style = 'margin:2px 0 10px 14px;';
        c.subcategorias.forEach(subName=>{
          const subBudget = Number(subBudgets[subName])||0;
          const subSpent = txMonth.filter(t=>t.categoria===c.nombre && t.subcategoria===subName && t.tipo==='Gasto').reduce((s,t)=>s+Number(t.monto),0);
          if(subBudget===0 && subSpent===0) return;
          const subPct = subBudget>0 ? Math.min(subSpent/subBudget*100,100) : (subSpent>0?100:0);
          const subClass = subBudget===0 ? 'pct-warn' : (subSpent/subBudget>=1?'pct-over':(subSpent/subBudget>=0.9?'pct-warn':'pct-ok'));
          const subRow = document.createElement('div');
          subRow.className = 'bar-row';
          subRow.style = 'margin-bottom:8px;';
          subRow.innerHTML = `
            <div class="bar-meta" style="font-size:0.72rem;"><span>↳ ${subName}</span><span>${fmtMoney(subSpent)}${subBudget>0?' / '+fmtMoney(subBudget):''}</span></div>
            <div class="bar-track" style="height:6px;"><div class="bar-fill ${subClass}" style="width:${subPct}%"></div></div>
          `;
          subWrap.appendChild(subRow);
        });
        budgetCard.appendChild(subWrap);
      }
    });
  }
  wrap.appendChild(budgetCard);

  // Ingresos por categoria
  const incCard = document.createElement('div');
  incCard.className = 'card';
  incCard.innerHTML = '<h3 class="cat-title">Ingresos por categoría</h3>';
  const incAll = state.categories.filter(c=>c.tipo==='Ingreso');
  let anyInc = false;
  incAll.forEach(c=>{
    const got = txMonth.filter(t=>t.categoria===c.nombre && t.tipo==='Ingreso').reduce((s,t)=>s+Number(t.monto),0);
    const budget = categoryBudget(c);
    if(got===0 && budget===0) return;
    anyInc = true;
    const pct = budget>0 ? Math.min(got/budget*100,100) : 100;
    const row = document.createElement('div');
    row.className = 'bar-row';
    row.innerHTML = `
      <div class="bar-meta"><span>${c.nombre}</span><span>${fmtMoney(got)}${budget>0?' / '+fmtMoney(budget)+' esperado':''}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:var(--income)"></div></div>
    `;
    incCard.appendChild(row);
  });
  if(!anyInc) incCard.innerHTML += '<div class="empty">Sin ingresos registrados este mes.</div>';
  wrap.appendChild(incCard);

  // Chart: gastos por categoria (pie via chart.js)

    chartCard.innerHTML = '<h3 class="cat-title">Distribución de gastos</h3><canvas id="pieChart"></canvas>';

    setTimeout(()=>{

      txMonth.filter(t=>t.tipo==='Gasto').forEach(t=>{ byCat[t.categoria] = (byCat[t.categoria]||0)+Number(t.monto); });
      const labels = Object.keys(byCat);
      const data = labels.map(l=>byCat[l]);
      const colors = ['#2563eb','#dc2626','#16a34a','#d97706','#7c3aed','#0891b2','#db2777','#65a30d','#ea580c','#4f46e5','#0d9488','#be185d','#ca8a04','#0284c7','#9333ea'];
      new Chart(document.getElementById('pieChart'), {
        type:'doughnut',
        data:{labels, datasets:[{data, backgroundColor:labels.map((_,i)=>colors[i%colors.length])}]},
        options:{plugins:{legend:{position:'bottom', labels:{color: getComputedStyle(document.body).color, boxWidth:12, font:{size:10}}}}}
      });
    },0);
  }

  app.appendChild(wrap);
  document.getElementById('prevM').onclick = ()=>{ currentMonth = shiftMonth(currentMonth,-1); render(); };
  document.getElementById('nextM').onclick = ()=>{ currentMonth = shiftMonth(currentMonth,1); render(); };
}

function getAvailableMonths(){
  const months=new Set();
  (state.transactions||[]).forEach(t=>{ const m=monthKey(t.fecha); if(m) months.add(m); });
  months.add(todayKey());
  return Array.from(months).sort().reverse();
}
function monthSelectOptions(selected){
  const months=getAvailableMonths();
  const names=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const groups={};
  months.forEach(m=>{const [y,mo]=m.split('-'); (groups[y]??=[]).push(m);});
  return Object.keys(groups).sort((a,b)=>Number(b)-Number(a)).map(y=>`<optgroup label="${y}">${groups[y].map(m=>{const mo=Number(m.split('-')[1]); return `<option value="${m}" ${m===selected?'selected':''}>${names[mo-1]} ${y}</option>`;}).join('')}</optgroup>`).join('');
}

function openEditTransaction(txId){
  const tx = state.transactions.find(t=>t.id===txId);
  if(!tx) return;
  const overlay=document.createElement('div');
  overlay.style='position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;';
  const cats=state.categories.filter(c=>c.tipo===tx.tipo);
  overlay.innerHTML=`
    <div class="card" style="max-width:420px;width:100%;max-height:90vh;overflow-y:auto;">
      <h3 class="cat-title">Editar transacción</h3>
      <div class="field"><label>Fecha</label><input type="date" id="eFecha" value="${tx.fecha||''}"></div>
      <div class="field"><label>Monto (Bs)</label><input type="text" inputmode="decimal" id="eMonto" value="${Number(tx.monto||0).toFixed(2)}" onfocus="this.select()"></div>
      <div class="field"><label>Categoría</label><select id="eCat">${cats.map(c=>`<option value="${c.nombre}" ${c.nombre===tx.categoria?'selected':''}>${c.nombre}</option>`).join('')}</select></div>
      <div class="field"><label>Subcategoría</label><select id="eSub"></select></div>

        <button class="btn secondary" id="eCancel">Cancelar</button><button class="btn" id="eSave">Guardar cambios</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  function refreshSubs(){
    const cat=getCategory(tx.tipo,document.getElementById('eCat').value);
    const subs=cat?.subcategorias||[];
    document.getElementById('eSub').innerHTML='<option value="">(ninguna)</option>'+subs.map(s=>`<option value="${s}" ${s===tx.subcategoria?'selected':''}>${s}</option>`).join('');
  }
  document.getElementById('eCat').onchange=refreshSubs;
  refreshSubs();
  document.getElementById('eCancel').onclick=()=>overlay.remove();
  document.getElementById('eSave').onclick=()=>{
    const fecha=document.getElementById('eFecha').value;
    const monto=parseAmount(document.getElementById('eMonto').value);
    if(!fecha){showToast('Ingresa una fecha válida');return;}
    if(!monto || monto<=0){showToast('Ingresa un monto válido');return;}
    tx.fecha=fecha;
    tx.monto=monto;
    tx.categoria=document.getElementById('eCat').value;
    tx.subcategoria=document.getElementById('eSub').value||null;
    const result=saveState();

    else showToast('Transacción actualizada');
    overlay.remove();
    render();
  };
}

  return String(value ?? '').replace(/[&<>\"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[ch]));
}

  overlay.querySelector('#saveNewSub').onclick=async()=>{
    const name=nameInput.value.trim();
    const budget=parseAmount(budgetInput.value);
    if(!name){ showToast('Ingresa el nombre de la subcategoría'); nameInput.focus(); return; }
    if(cat.subcategorias.includes(name)){ showToast('Esa subcategoría ya existe'); nameInput.focus(); return; }
    const btn=overlay.querySelector('#saveNewSub');
    btn.disabled=true;
    btn.textContent='Creando…';
    try{
      await onCreate(name, budget>0?budget:0);
      close();
    }catch(err){
      console.error(err);
      btn.disabled=false;
      btn.textContent='Crear subcategoría';
      showToast('⚠️ No se pudo crear la subcategoría.');
    }
  };

  nameInput.addEventListener('keydown',e=>{ if(e.key==='Enter') overlay.querySelector('#saveNewSub').click(); });
}

function renderCategorias(app){
  const wrap = document.createElement('div');

  ['Gasto','Ingreso'].forEach(tipo=>{
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<h3 class="cat-title">${tipo==='Gasto'?'Categorías de gasto':'Categorías de ingreso'}</h3>`;
    const cats = state.categories.filter(c=>c.tipo===tipo);

    cats.forEach(c=>{
      const details = document.createElement('details');
      details.className = 'category-dropdown';
      details.style.cssText = 'border:1px solid var(--border);border-radius:12px;margin:8px 0;background:var(--card);overflow:hidden;';

      const summary = document.createElement('summary');
      summary.style.cssText = 'display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 15px;cursor:pointer;list-style:none;font-weight:700;';
      summary.innerHTML = `
        <span style="display:flex;align-items:center;gap:9px;min-width:0;">
          <span style="font-size:0.9rem;opacity:.65;">▶</span>
          <span>${c.nombre}</span>
        </span>
        <span style="display:flex;align-items:center;gap:5px;flex-shrink:0;">
          <button type="button" data-addsubtop="${c.id}" title="Nueva subcategoría" aria-label="Nueva subcategoría" style="border:none;background:none;color:var(--green);font-size:1.45rem;font-weight:700;line-height:1;cursor:pointer;padding:2px 5px;">+</button>
          <button type="button" data-editcat="${c.id}" title="Editar categoría" aria-label="Editar categoría" style="border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--text);font-size:0.88rem;line-height:1;cursor:pointer;padding:6px 7px;">✎</button>
          <button type="button" data-delcat="${c.id}" title="Eliminar categoría" aria-label="Eliminar categoría" style="display:none;border:none;background:none;color:#dc2626;font-size:0.95rem;font-weight:700;cursor:pointer;padding:4px 5px;">✕</button>
        </span>
      `;
      const addBtn = summary.querySelector('[data-addsubtop]');
      const editBtn = summary.querySelector('[data-editcat]');
      const delCatBtn = summary.querySelector('[data-delcat]');
      addBtn.addEventListener('click', e=>e.stopPropagation());
      editBtn.addEventListener('click', e=>e.stopPropagation());
      delCatBtn.addEventListener('click', e=>e.stopPropagation());
      details.appendChild(summary);

      const body = document.createElement('div');
      body.style.cssText = 'padding:0 15px 14px;border-top:1px solid var(--border);';
      const hasSubs = c.subcategorias && c.subcategorias.length>0;

      const budgetInfo = document.createElement('div');
      budgetInfo.style.cssText = 'font-size:0.78rem;color:var(--muted);margin:12px 0 10px;';
      budgetInfo.innerHTML = hasSubs
        ? `Presupuesto total: <b>${fmtMoney(categoryBudget(c))}</b> (se suma automáticamente de las subcategorías)`
        : `Presupuesto mensual (Bs)`;
      body.appendChild(budgetInfo);

      if(hasSubs){
        const list = document.createElement('div');
        list.className = 'sub-budget-list';
        list.innerHTML = c.subcategorias.map(sub=>{
          const safeSub = String(sub).replace(/\\/g,'\\\\').replace(/"/g,'&quot;');
          return `
          <div class="inline-form" style="align-items:center;margin-bottom:7px;" data-subrow="${c.id}|${safeSub}">
            <div style="flex:2;min-width:110px;font-size:0.85rem;">${sub}</div>
            <div style="flex:1;min-width:90px;"><input type="text" inputmode="decimal" class="subBudgetInput" data-subbudget="${c.id}|${sub}" value="${(c.subPresupuestos&&c.subPresupuestos[sub])>0?c.subPresupuestos[sub]:''}" placeholder="0" onfocus="this.select()"></div>
            <span class="sub-edit-actions" style="display:none;gap:2px;align-items:center;">
              <button type="button" data-editsub="${c.id}|${sub}" title="Editar subcategoría" style="border:1px solid var(--border);border-radius:6px;background:var(--bg);cursor:pointer;padding:4px 6px;">✎</button>
              <button type="button" data-delsub="${c.id}|${sub}" title="Eliminar subcategoría" style="border:none;background:none;color:#dc2626;cursor:pointer;font-size:0.9rem;padding:4px 5px;">✕</button>
            </span>
          </div>`;
        }).join('');
        body.appendChild(list);
      } else {
        const budget = document.createElement('input');
        budget.type = 'text';
        budget.inputMode = 'decimal';
        budget.className = 'budgetInput';
        budget.dataset.budget = c.id;
        budget.value = c.presupuesto>0 ? c.presupuesto : '';
        budget.placeholder = '0';
        budget.style.cssText = 'width:100%;box-sizing:border-box;';
        budget.onfocus = function(){this.select();};
        body.appendChild(budget);
      }

      details.appendChild(body);
      card.appendChild(details);

      // El botón + abre un formulario para crear la subcategoría.
      addBtn.onclick = e=>{
        e.preventDefault();
        e.stopPropagation();
        collectBudgetInputs();
        showNewSubcategoryModal(c, async(name, budget)=>{
          c.subcategorias.push(name);
          if(!c.subPresupuestos) c.subPresupuestos = {};
          c.subPresupuestos[name] = budget;
          const result=await saveState();
          if(result && result.cloud===false && result.error) throw result.error;
          showToast('✅ Subcategoría creada');
          render();
        });
      };

      // Modo edición: muestra/oculta las acciones de cada subcategoría.
      editBtn.onclick = e=>{
        e.preventDefault();
        e.stopPropagation();
        const actions = body.querySelectorAll('.sub-edit-actions');
        const editing = editBtn.dataset.editing === '1';
        actions.forEach(a=>a.style.display = editing ? 'none' : 'flex');
        editBtn.dataset.editing = editing ? '0' : '1';
        editBtn.innerHTML = editing ? '✎' : '✓';
        editBtn.title = editing ? 'Editar categoría' : 'Terminar edición';
        delCatBtn.style.display = editing ? 'none' : 'inline-block';
      };

      delCatBtn.onclick = e=>{
        e.preventDefault();
        e.stopPropagation();
        collectBudgetInputs();
        showDeleteCategoryModal(c, async()=>{
          // Las transacciones se conservan; solo pierden la categoría/subcategoría.
          (state.transactions||[]).forEach(t=>{
            if(t.categoria===c.nombre){
              t.categoria=null;
              t.subcategoria=null;
            }
          });
          state.categories = state.categories.filter(x=>x.id!==c.id);
          if(currentUser && UUID_RE.test(c.id||'')){
            const {error}=await supabaseClient.from('categorias').delete()
              .eq('usuario_id',currentUser.id).eq('id',c.id);
            if(error) throw error;
          }
          const result=await saveState();
          if(result && result.cloud===false && result.error) throw result.error;
          showToast('✅ Categoría eliminada');
          render();
        });
      };

      body.querySelectorAll('[data-editsub]').forEach(btn=>{
        btn.onclick = ()=>{
          collectBudgetInputs();
          const [catId, oldName] = btn.dataset.editsub.split('|');
          const cat = state.categories.find(x=>x.id===catId);
          if(!cat) return;
          const newName = prompt('Editar subcategoría:', oldName);
          if(newName===null) return;
          const name = newName.trim();
          if(!name || name===oldName) return;
          if(cat.subcategorias.includes(name)){ showToast('Esa subcategoría ya existe'); return; }
          const idx = cat.subcategorias.indexOf(oldName);
          if(idx<0) return;
          cat.subcategorias[idx] = name;
          if(!cat.subPresupuestos) cat.subPresupuestos = {};
          cat.subPresupuestos[name] = cat.subPresupuestos[oldName] || 0;
          delete cat.subPresupuestos[oldName];
          saveState().then(result=>{
            if(result && result.cloud===false && result.error) showToast('⚠️ Se guardó localmente; no se pudo sincronizar.');
            else showToast('✅ Subcategoría actualizada');
          });
          render();
        };
      });

      body.querySelectorAll('[data-delsub]').forEach(btn=>{
        btn.onclick = e=>{
          e.preventDefault();
          e.stopPropagation();
          collectBudgetInputs();
          const raw=btn.dataset.delsub || '';
          const sep=raw.indexOf('|');
          if(sep<0) return;
          const catId=raw.slice(0,sep);
          const sub=raw.slice(sep+1);
          const cat=state.categories.find(x=>x.id===catId);
          if(!cat) return;

          showDeleteSubcategoryModal(cat, sub, async()=>{
            // Primero actualizamos el estado local para que la interfaz y los
            // cálculos de presupuesto queden consistentes.
            cat.subcategorias=cat.subcategorias.filter(x=>x!==sub);
            if(cat.subPresupuestos) delete cat.subPresupuestos[sub];

            // Las transacciones conservan la categoría y el monto, pero pierden
            // únicamente la subcategoría eliminada.
            (state.transactions||[]).forEach(t=>{
              if(t.categoria===cat.nombre && t.subcategoria===sub) t.subcategoria=null;
            });

            // Eliminación explícita en Supabase. Las FK de presupuesto/reglas
            // están configuradas con CASCADE y las transacciones con SET NULL.
            if(currentUser && UUID_RE.test(cat.id||'')){
              const {error}=await supabaseClient
                .from('subcategorias')
                .delete()
                .eq('usuario_id',currentUser.id)
                .eq('categoria_id',cat.id)
                .eq('nombre',sub);
              if(error) throw error;
            }

            const result=await saveState();
            if(result && result.cloud===false && result.error) throw result.error;
            showToast('✅ Subcategoría eliminada');
            render();
          });
        };
      });
    });

    if(cats.length===0) card.innerHTML += '<div class="empty">Sin categorías todavía.</div>';

    const addForm = document.createElement('div');
    addForm.className = 'inline-form';
    addForm.style = 'margin-top:10px;';
    addForm.innerHTML = `
      <div><input type="text" class="newCatInput" placeholder="Nueva categoría de ${tipo.toLowerCase()}"></div>
      <div><button class="btn" data-addcat="${tipo}">Agregar categoría</button></div>
    `;
    card.appendChild(addForm);
    wrap.appendChild(card);
  });

  const saveBar = document.createElement('div');
  saveBar.style = 'position:sticky;bottom:0;padding:12px 0 4px;background:var(--bg);';
  saveBar.innerHTML = `<button class="btn" id="saveBudgetsBtn" style="width:100%;background:var(--green);font-size:0.95rem;padding:13px;">Guardar</button>`;
  wrap.appendChild(saveBar);
  app.appendChild(wrap);

  function collectBudgetInputs(){
    wrap.querySelectorAll('[data-budget]').forEach(inp=>{
      const c = state.categories.find(c=>c.id===inp.dataset.budget);
      if(c) c.presupuesto = parseAmount(inp.value);
    });
    wrap.querySelectorAll('[data-subbudget]').forEach(inp=>{
      const [catId, subName] = inp.dataset.subbudget.split('|');
      const c = state.categories.find(c=>c.id===catId);
      if(c){
        if(!c.subPresupuestos) c.subPresupuestos = {};
        c.subPresupuestos[subName] = parseAmount(inp.value);
      }
    });
  }

  document.getElementById('saveBudgetsBtn').onclick = async ()=>{
    collectBudgetInputs();
    const btn = document.getElementById('saveBudgetsBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="d-spinner">D</span>&nbsp; Guardando…';
    const result = await saveState();
    if(result.cloud) showToast('✅ Presupuestos guardados (sincronizado)');
    else if(result.error) showToast('⚠️ Guardado en este dispositivo. No se pudo sincronizar con la nube.');
    else showToast('✅ Presupuestos guardados en este dispositivo');
    render();
  };

  wrap.querySelectorAll('[data-addcat]').forEach(btn=>{
    btn.onclick = ()=>{
      collectBudgetInputs();
      const input = btn.parentElement.parentElement.querySelector('.newCatInput');
      const val = input.value.trim();
      if(!val) return;
      const tipo = btn.dataset.addcat;
      if(getCategory(tipo,val)){ showToast('Esa categoría ya existe'); return; }
      state.categories.push({id:uid('cat'), tipo, nombre:val, subcategorias:[], presupuesto:0, subPresupuestos:{}});
      saveState().then(result=>{
        if(result && result.cloud===false && result.error) showToast('⚠️ Se guardó localmente; no se pudo sincronizar.');
        else showToast('✅ Categoría agregada');
      });
      render();
    };
  });
}

/* ================= SUBIR EXTRACTO ================= */
function renderSubir(app){
  const wrap = document.createElement('div');
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <h3 class="cat-title">Subir extracto bancario</h3>
    <p style="color:var(--muted);font-size:0.85rem;">Formato soportado: extracto BNB en Excel (.xls/.xlsx) o CSV. Sube el archivo tal como lo descargas de tu banco.</p>
    <div class="upload-drop" id="dropZone">
      📂 Toca para elegir el archivo de tu extracto<br><span style="font-size:0.75rem;">.xlsx, .xls o .csv</span>
    </div>
    <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" class="hidden">
    <div id="uploadResult" style="margin-top:14px;"></div>
  `;
  wrap.appendChild(card);
  app.appendChild(wrap);

  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  dropZone.onclick = ()=>fileInput.click();
  fileInput.onchange = (e)=>{
    if(e.target.files.length) handleFile(e.target.files[0]);
  };
}

function handleFile(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, {type:'array', cellDates:false});
      const sheetName = workbook.SheetNames[0];
      const sheet = workbook.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});
      processBankRows(rows);
    }catch(err){
      document.getElementById('uploadResult').innerHTML = `<div class="alert danger">No se pudo leer el archivo: ${err.message}</div>`;
    }
  };
  reader.readAsArrayBuffer(file);
}

function findHeaderRow(rows){
  for(let i=0;i<Math.min(rows.length,10);i++){
    const rowNorm = rows[i].map(c=>normalize(c));
    if(rowNorm.includes('fecha') && (rowNorm.some(c=>c.includes('debito')) || rowNorm.some(c=>c.includes('credito')) || rowNorm.some(c=>c.includes('descripcion')))){
      return i;
    }
  }
  return -1;
}

function colIndex(headerRow, ...names){
  const norm = headerRow.map(c=>normalize(c));
  for(const name of names){
    const idx = norm.findIndex(c=>c.includes(normalize(name)));
    if(idx>=0) return idx;
  }
  return -1;
}

function parseAmount(v){
  if(v===''||v==null) return 0;
  if(typeof v === 'number') return v;
  let s = String(v).trim().replace(/[^\d.,-]/g,'');
  if(s.includes(',') && s.includes('.')){
    s = s.replace(/\./g,'').replace(',','.');
  } else if(s.includes(',') && !s.includes('.')){
    s = s.replace(',','.');
  }
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

function parseDate(v){
  if(!v) return '';
  if(typeof v === 'number'){
    const d = XLSX.SSF.parse_date_code(v);
    if(d) return d.y+'-'+String(d.m).padStart(2,'0')+'-'+String(d.d).padStart(2,'0');
  }
  const s = String(v).trim();
  const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if(m){
    return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  }
  const m2 = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m2) return m2[0];
  return s;
}

function matchRules(text){
  const norm = normalize(text);
  let best = null;
  let bestLen = 0;
  state.rules.forEach(r=>{
    if(norm.includes(r.keyword) && r.keyword.length>bestLen){
      best = r; bestLen = r.keyword.length;
    }
  });
  return best;
}

function processBankRows(rows){
  const headerIdx = findHeaderRow(rows);
  const resultDiv = document.getElementById('uploadResult');
  if(headerIdx===-1){
    resultDiv.innerHTML = '<div class="alert danger">No reconozco el formato de este archivo. Verifica que sea el extracto tal como lo exporta tu banco.</div>';
    return;
  }
  const header = rows[headerIdx];
  const iFecha = colIndex(header,'fecha');
  const iDesc = colIndex(header,'descripcion');
  const iDebito = colIndex(header,'debito');
  const iCredito = colIndex(header,'credito');
  const iCodigo = colIndex(header,'codigo de transaccion','codigo');
  const iAdicional = colIndex(header,'adicionales','adicional');

  let imported=0, autoCat=0, pendientes=0, duplicadas=0;
  const existingRefs = new Set(state.transactions.map(t=>t.refId).filter(Boolean));

  for(let i=headerIdx+1;i<rows.length;i++){
    const row = rows[i];
    if(!row || row.every(c=>c==='')) continue;
    const fecha = parseDate(row[iFecha]);
    if(!fecha) continue;
    const debito = iDebito>=0 ? parseAmount(row[iDebito]) : 0;
    const credito = iCredito>=0 ? parseAmount(row[iCredito]) : 0;
    if(debito===0 && credito===0) continue;
    const tipo = debito>0 ? 'Gasto' : 'Ingreso';
    const monto = debito>0 ? debito : credito;
    const descBase = iDesc>=0 ? String(row[iDesc]||'') : '';
    let extra = iAdicional>=0 ? String(row[iAdicional]||'') : '';
    const datoMatch = extra.match(/Dato Adicional:\s*(.+)$/i);
    if(datoMatch) extra = datoMatch[1];
    const fullText = (descBase+' '+extra).trim();
    const refId = iCodigo>=0 ? String(row[iCodigo]||'') : (fecha+'|'+fullText+'|'+monto);

    if(refId && existingRefs.has(refId)){ duplicadas++; continue; }
    if(refId) existingRefs.add(refId);

    const rule = matchRules(fullText);
    const tx = {
      id: uid('tx'),
      fecha, descripcion: fullText || descBase || '(sin descripción)',
      monto, tipo,
      categoria: rule ? rule.categoria : null,
      subcategoria: rule ? rule.subcategoria : null,
      cuenta: 'BNB',
      origen: 'extracto',
      estado: rule ? 'categorizado' : 'pendiente',
      refId
    };
    state.transactions.push(tx);
    imported++;
    if(rule) autoCat++; else pendientes++;
  }

  saveState();
  resultDiv.innerHTML = `
    <div class="alert ok">✅ ${imported} transacción(es) importadas.</div>
    ${autoCat>0?`<div class="alert ok">🏷️ ${autoCat} categorizadas automáticamente.</div>`:''}
    ${pendientes>0?`<div class="alert warn">❓ ${pendientes} necesitan que elijas categoría (ve a la pestaña Pendientes).</div>`:''}
    ${duplicadas>0?`<div class="alert warn">↩️ ${duplicadas} ya existían y se omitieron (evitando duplicados).</div>`:''}
  `;
  renderNav();
}

/* Confirmación reutilizable con espera de 10 segundos */
function showTimedDeleteConfirm({title,message,detail,confirmText='Eliminar'}){
  return new Promise(resolve=>{
    const overlay=document.createElement('div');
    overlay.className='modal-overlay';
    overlay.innerHTML=`
      <div class="modal" style="max-width:460px;">
        <h3>${title}</h3>
        <p>${message}</p>
        ${detail?`<p style="color:var(--muted);font-size:.86rem;">${detail}</p>`:''}
        <div id="timedDeleteCountdown" class="alert warn" style="text-align:center;margin:14px 0;">Debes esperar 10 segundos para confirmar.</div>
        <div style="display:flex;gap:8px;justify-content:flex-end;">
          <button class="btn" id="timedDeleteCancel">Cancelar</button>
          <button class="btn danger" id="timedDeleteConfirm" disabled>${confirmText} (10)</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    let remaining=10;
    const cancel=()=>{clearInterval(timer);overlay.remove();resolve(false);};
    document.getElementById('timedDeleteCancel').onclick=cancel;
    const confirm=document.getElementById('timedDeleteConfirm');
    const timer=setInterval(()=>{
      remaining--;
      if(remaining<=0){
        clearInterval(timer);
        confirm.disabled=false;
        confirm.textContent=confirmText;
        document.getElementById('timedDeleteCountdown').textContent='Ya puedes confirmar la eliminación.';
      }else{
        confirm.textContent=`${confirmText} (${remaining})`;
      }
    },1000);
    confirm.onclick=()=>{clearInterval(timer);overlay.remove();resolve(true);};
  });
}

/* ================= BACKUP ================= */
function renderBackup(app){
  const wrap = document.createElement('div');
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <h3 class="cat-title">Copia de seguridad</h3>
    <p style="color:var(--muted);font-size:0.85rem;">
      Descarga una copia completa de los datos disponibles en esta aplicación.
    </p>
    <div id="backupStatus" style="margin:10px 0;"></div>
    <button class="btn" id="downloadBtn">Descargar copia (JSON)</button>
    <hr style="border:none;border-top:1px solid var(--border);margin:16px 0;">
    <label>Restaurar desde archivo</label>
    <input type="file" id="restoreInput" accept=".json">
    <hr style="border:none;border-top:1px solid var(--border);margin:16px 0;">
    <button class="btn danger" id="resetBtn">Borrar todos los datos</button>
  `;
  wrap.appendChild(card);
  app.appendChild(wrap);

  const status = (msg, ok=false) => {
    const el=document.getElementById('backupStatus');
    el.innerHTML = msg ? `<div class="alert ${ok?'ok':'warn'}">${msg}</div>` : '';
  };

  // Descarga robusta: genera el JSON desde el estado actual y mantiene el archivo
  // aunque el navegador tarde en procesar la descarga.
  document.getElementById('downloadBtn').onclick = ()=>{
    const btn=document.getElementById('downloadBtn');
    btn.disabled=true;
    btn.textContent='Preparando copia…';
    status('');

    try{
      const backup = {
        version: 1,
        created_at: new Date().toISOString(),
        source: 'Mi Asistente Financiero',
        data: state
      };

      const json = JSON.stringify(backup, null, 2);
      const blob = new Blob([json], {type:'application/json'});
      const filename = 'mi-asistente-financiero-backup-' + new Date().toISOString().slice(0,10) + '.json';

      /*
       * IMPORTANTE:
       * La aplicación se está ejecutando como file://.
       * No usamos showSaveFilePicker aquí porque su rechazo asíncrono
       * puede hacer que el navegador pierda el permiso de descarga
       * iniciado por el clic del usuario.
       *
       * Usamos directamente el mecanismo estándar de descarga del
       * navegador, iniciado sincrónicamente dentro del onclick.
       */
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.setAttribute('download', filename);
      a.style.position='fixed';
      a.style.left='-9999px';
      document.body.appendChild(a);

      // El clic ocurre directamente dentro de la acción del usuario.
      a.click();

      // No revocamos inmediatamente el Blob: dejamos tiempo al navegador.
      setTimeout(()=>{
        try{
          a.remove();
          URL.revokeObjectURL(url);
        }catch(e){}
      }, 10000);

      status('Copia descargada. Revisa la carpeta Descargas de tu navegador.', true);
    }catch(err){
      console.error('Error descargando backup:', err);
      status('No se pudo generar la copia de seguridad: '+(err.message||err), false);
    }finally{
      btn.disabled=false;
      btn.textContent='Descargar copia (JSON)';
    }
  };

  document.getElementById('restoreInput').onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async (ev)=>{
      try{
        const raw = JSON.parse(ev.target.result);
        const parsed = raw && raw.data ? raw.data : raw;
        if(!parsed || !Array.isArray(parsed.categories) || !Array.isArray(parsed.transactions)) throw new Error('Archivo inválido');
        state = parsed;
        saveLocal();
        // La restauración completa a la nube se hará de forma controlada por la
        // capa de sincronización existente, sin borrar tablas automáticamente.
        if(currentUser){
          const result = await saveState();
          if(!result || !result.cloud) throw new Error(result?.error || 'No se pudo sincronizar');
        }
        showToast('Datos restaurados');
        currentTab = 'dashboard';
        render();
      }catch(err){
        console.error('Error restaurando backup:',err);
        showToast('No se pudo restaurar el archivo de respaldo');
      }finally{
        e.target.value='';
      }
    };
    reader.readAsText(file);
  };

  document.getElementById('resetBtn').onclick = async ()=>{
    const btn=document.getElementById('resetBtn');
    if(!currentUser){
      showToast('Debes iniciar sesión para borrar los datos.');
      return;
    }

    const ok = await showTimedDeleteConfirm({
      title:'Borrar todos los datos',
      message:'Se eliminarán de forma permanente todas tus categorías, subcategorías, reglas, presupuestos y transacciones de esta cuenta. Esta acción no se puede deshacer.',
      detail:'Las credenciales de acceso NO se eliminan.',
      confirmText:'Borrar todos los datos'
    });
    if(!ok) return;

    btn.disabled=true;
    btn.textContent='Borrando…';
    try{
      // Orden seguro respetando las relaciones: primero tablas hijas y luego categorías.
      const tables=['presupuestos','reglas_categorizacion','transacciones','subcategorias','categorias'];
      for(const table of tables){
        const {error}=await supabaseClient.from(table).delete().eq('usuario_id',currentUser.id);
        if(error) throw error;
      }
      state={categories:[],transactions:[],rules:[],budgets:{}};
      saveLocal();
      cloudActive=true;
      showToast('Todos los datos fueron eliminados');
      currentTab='dashboard';
      render();
    }catch(err){
      console.error('Error borrando todos los datos:',err);
      showToast('No se pudieron borrar todos los datos de la nube');
    }finally{
      btn.disabled=false;
      btn.textContent='Borrar todos los datos';
    }
  };
}

/* ================= AUTH / INIT ================= */
function showLoginMessage(msg, error=false){
  const el=document.getElementById('loginMsg'); el.textContent=msg||''; el.style.color=error?'var(--red)':'var(--muted)';
}
async function handleLogin(){
  const email=document.getElementById('loginEmail').value.trim();
  const password=document.getElementById('loginPassword').value;
  const btn=document.getElementById('loginBtn');
  if(!email||!password){showLoginMessage('Ingresa correo y contraseña.',true);return;}
  btn.disabled=true; btn.textContent='Ingresando…'; showLoginMessage('');
  const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
  if(error){showLoginMessage('No se pudo iniciar sesión. Revisa tus datos.',true);btn.disabled=false;btn.textContent='🔐 Iniciar sesión';return;}
  currentUser=data.user;
  console.log('Supabase sesión activa:', currentUser.id);
  document.getElementById('authGate').style.display='none';
  document.getElementById('logoutBtn').style.display='inline-block';
  await initApp();
  btn.disabled=false;
  btn.textContent='🔐 Iniciar sesión';
}

document.getElementById('loginBtn').onclick=handleLogin;
document.getElementById('loginPassword').addEventListener('keydown',e=>{if(e.key==='Enter')handleLogin();});
document.getElementById('logoutBtn').onclick=async()=>{
  const btn=document.getElementById('logoutBtn');
  btn.disabled=true;
  btn.textContent='Saliendo…';

  // Para un HTML abierto como file://, usamos cierre local de sesión.
  // Así no dejamos la interfaz bloqueada esperando una respuesta de red.
  try{
    const {error}=await supabaseClient.auth.signOut({scope:'local'});
    if(error) console.warn('Logout local:',error);
  }catch(e){
    console.warn('Logout:',e);
  }

  currentUser=null;
  document.getElementById('app').innerHTML='';
  document.getElementById('tabNav').innerHTML='';
  document.getElementById('logoutBtn').style.display='none';
  document.getElementById('logoutBtn').disabled=false;
  document.getElementById('logoutBtn').textContent='Cerrar sesión';
  document.getElementById('authGate').style.display='flex';
  document.getElementById('loginPassword').value='';
  document.getElementById('loginEmail').focus();
  showLoginMessage('Sesión cerrada.');
};

(async()=>{
  const {data}=await supabaseClient.auth.getSession();
  if(data.session){
    currentUser=data.session.user;
    document.getElementById('authGate').style.display='none';
    document.getElementById('logoutBtn').style.display='inline-block';
    await initApp();
  } else {
    document.getElementById('authGate').style.display='flex';
  }
  supabaseClient.auth.onAuthStateChange((event,session)=>{
    if(event==='SIGNED_OUT'){document.getElementById('authGate').style.display='flex';document.getElementById('logoutBtn').style.display='none';}
  });
})();
</script>
<script>
/* FIX BACKUP: borrar solo transacciones */
document.addEventListener('click', async (event) => {
  const btn = event.target.closest('#resetBtn');
  if (!btn) return;
  event.preventDefault();
  event.stopPropagation();
  event.stopImmediatePropagation();
  if (!currentUser) {
    showToast('Debes iniciar sesión para borrar los datos.');
    return;
  }
  const ok = await showTimedDeleteConfirm({
    title:'Borrar todos los datos',
    message:'Se eliminarán de forma permanente todas las transacciones de esta cuenta. Tus categorías, subcategorías, reglas y presupuestos permanecerán intactos.',
    detail:'Las credenciales de acceso NO se eliminan.',
    confirmText:'Borrar todas las transacciones'
  });
  if (!ok) return;
  btn.disabled = true;
  btn.textContent = 'Borrando…';
  try {
    const { error } = await supabaseClient
      .from('transacciones')
      .delete()
      .eq('usuario_id', currentUser.id);
    if (error) throw error;
    state.transactions = [];
    saveLocal();
    cloudActive = true;
    showToast('Todas las transacciones fueron eliminadas');
    currentTab = 'dashboard';
    render();
  } catch (err) {
    console.error('Error borrando transacciones:', err);
    showToast('No se pudieron borrar las transacciones de la nube');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Borrar todos los datos';
  }
}, true);
</script>
